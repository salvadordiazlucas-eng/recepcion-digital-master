<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente - Identidad y Marca Blanca</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
        }
        .identity-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-top: 5px solid var(--brand-color, #3b82f6);
        }
        .header-preview {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .logo-box {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 1px dashed #cbd5e1;
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .info-box h2 {
            margin: 0 0 5px 0;
            font-size: 1.4rem;
            color: #1e293b;
        }
        .info-box p {
            margin: 0;
            font-size: 0.9rem;
            color: #64748b;
        }
        .config-form {
            display: grid;
            gap: 1rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }
        input[type="text"], input[type="color"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input[type="color"] {
            height: 40px;
            width: 100%;
            cursor: pointer;
        }
        .btn-save {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn-save:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="identity-card" id="cardContainer">
        <!-- Vista previa en tiempo real -->
        <div class="header-preview">
            <div class="logo-box" id="previewLogoContainer">
                <span id="previewLogoEmoji">🏢</span>
            </div>
            <div class="info-box">
                <h2 id="previewName">Nombre del Establecimiento</h2>
                <p id="previewSlogan">Eslogan corporativo o subtítulo de bienvenida</p>
            </div>
        </div>

        <!-- Formulario de configuración de Marca Blanca -->
        <div class="config-form">
            <h3>⚙️ Editor de Identidad B2C</h3>
            
            <div class="form-group">
                <label>Nombre Comercial:</label>
                <input type="text" id="inputName" value="Recepción Inteligente S.L." oninput="actualizarVista()">
            </div>

            <div class="form-group">
                <label>Eslogan / Subtítulo:</label>
                <input type="text" id="inputSlogan" value="Su asistente digital disponible 24/7" oninput="actualizarVista()">
            </div>

            <div class="form-group">
                <label>URL del Logo (Imagen):</label>
                <input type="text" id="inputLogoUrl" placeholder="https://ejemplo.com/logo.png" oninput="actualizarVista()">
            </div>

            <div class="form-group">
                <label>Color Corporativo Principal:</label>
                <input type="color" id="inputColor" value="#3b82f6" oninput="actualizarVista()">
            </div>

            <button class="btn-save" onclick="alert('Identidad guardada y aplicada correctamente al bloque.')">Guardar Cambios de Marca</button>
        </div>
    </div>

    <script>
        function actualizarVista() {
            const nombre = document.getElementById('inputName').value;
            const slogan = document.getElementById('inputSlogan').value;
            const logoUrl = document.getElementById('inputLogoUrl').value.trim();
            const color = document.getElementById('inputColor').value;

            document.getElementById('previewName').innerText = nombre || 'Nombre del Establecimiento';
            document.getElementById('previewSlogan').innerText = slogan || 'Eslogan corporativo';
            
            const logoContainer = document.getElementById('previewLogoContainer');
            if (logoUrl) {
                logoContainer.innerHTML = `<img src="${logoUrl}" alt="Logo" onerror="this.onerror=null; this.parentNode.innerHTML='❌';">`;
            } else {
                logoContainer.innerHTML = `<span id="previewLogoEmoji">🏢</span>`;
            }
            
            document.getElementById('cardContainer').style.setProperty('--brand-color', color);
        }
    </script>
</body>
</html>
